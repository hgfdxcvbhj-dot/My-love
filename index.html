<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You Are My Love</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #startScreen {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .start-heart {
            font-size: 80px;
            color: #ff3366;
            animation: pulse 1.5s infinite;
        }

        .start-text {
            margin-top: 15px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ff99aa;
        }

        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
            50% { transform: scale(1.15); text-shadow: 0 0 25px rgba(255, 51, 102, 0.8); }
            100% { transform: scale(1); text-shadow: 0 0 10px rgba(255, 51, 102, 0.5); }
        }

        .falling-heart {
            position: absolute;
            top: -20px;
            color: #ff3366;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        .sequence-text {
            position: absolute;
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 3px;
            background: linear-gradient(45deg, #fff, #ff99aa, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 51, 102, 0.6);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.8s ease, transform 0.8s ease;
            z-index: 10;
        }

        .sequence-text.show {
            opacity: 1;
            transform: scale(1);
        }

        #finalCard {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 1s ease, transform 1s ease;
            z-index: 10;
        }

        #finalCard.show {
            opacity: 1;
            transform: scale(1);
        }

        .big-neon-heart {
            position: relative;
            width: 260px;
            height: 230px;
            border: 3px dashed #ff3366;
            border-radius: 50% 50% 0 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.5), inset 0 0 30px rgba(255, 51, 102, 0.3);
            animation: heartGlow 2s infinite alternate;
        }

        @keyframes heartGlow {
            0% { box-shadow: 0 0 20px rgba(255, 51, 102, 0.4); }
            100% { box-shadow: 0 0 40px rgba(255, 51, 102, 0.9); }
        }

        .inner-content {
            transform: rotate(45deg);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }

        .inner-content h2 {
            margin: 0;
            font-size: 1.8rem;
            color: #ff99aa;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inner-content p {
            margin: 8px 0 0 0;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #ffccd5;
        }
    </style>
</head>
<body>

    <!-- Start Screen -->
    <div id="startScreen">
        <div class="start-heart">❤️</div>
        <div class="start-text">Tap to Play Video<br><span style="font-size: 0.8rem; opacity: 0.7;">Experience the Magic</span></div>
    </div>

    <!-- Sequence Display Text -->
    <div id="sequenceText" class="sequence-text"></div>

    <!-- Final Card -->
    <div id="finalCard">
        <div class="big-neon-heart">
            <div class="inner-content">
                <h2>I <span style="color:#ff3366;">❤️</span> You</h2>
                <p>Always & Forever</p>
            </div>
        </div>
    </div>

    <script>
        const startScreen = document.getElementById('startScreen');
        const sequenceText = document.getElementById('sequenceText');
        const finalCard = document.getElementById('finalCard');

        // Create falling background hearts
        function createFallingHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.classList.add('falling-heart');
                heart.innerHTML = '❤️';
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, 200);
        }

        startScreen.addEventListener('click', () => {
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                createFallingHearts();
                startAnimationSequence();
            }, 500);
        });

        const steps = ["3", "2", "1", "YOU", "ARE", "MY", "LOVE"];
        let currentStep = 0;

        function startAnimationSequence() {
            if (currentStep < steps.length) {
                sequenceText.textContent = steps[currentStep];
                sequenceText.classList.add('show');

                setTimeout(() => {
                    sequenceText.classList.remove('show');
                    currentStep++;
                    setTimeout(startAnimationSequence, 300); // Gap between words
                }, 900); // Display duration for each word
            } else {
                // Show final glowing heart card
                finalCard.classList.add('show');
            }
        }
    </script>
</body>
</html>
